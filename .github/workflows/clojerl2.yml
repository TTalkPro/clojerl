name: clojerl2
on:
  push:
    branches:
      - master
    paths:
      - 'clojerl2/**'
      - '.github/workflows/clojerl2.yml'
  pull_request:
    paths:
      - 'clojerl2/**'
      - '.github/workflows/clojerl2.yml'
jobs:
  test:
    strategy:
      matrix:
        # designs/02 §7 risk 4: OTP 27+
        otp-version: [27, 28]
    runs-on: ubuntu-latest
    container:
      image: erlang:${{ matrix.otp-version }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: true   # clojerl2/vendor/clojure-test-suite
    - name: Compile and test (reader, nanopass pipeline, namespaces, macros)
      run: make -C clojerl2 test
    - name: Corpus gate (designs/04 §5.1; failures must match test/corpus-known-failures.edn)
      run: make -C clojerl2 certify
    - name: REPL / CLI smoke (clojerl2-023)
      run: make -C clojerl2 smoke
    - name: rebar3 plugin on the example project (clojerl2-024)
      run: make -C clojerl2 example
    - name: Documentation examples (clojerl2-025)
      run: make -C clojerl2 docs-check
    - name: clojure-test-suite gate (clojerl2-022; counts must match test/cts-known-failures.txt)
      run: make -C clojerl2 cts
